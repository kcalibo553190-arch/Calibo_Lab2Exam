<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ItemManager - Laravel CRUD Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
            <button onclick="showView('index')" class="flex items-center gap-2 text-xl font-bold text-indigo-600 hover:text-indigo-700 transition">
                <i class="fa-solid fa-boxes-stacked text-2xl"></i>
                <span>ItemManager</span>
            </button>
            <button onclick="openCreateModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition">
                <i class="fa-solid fa-plus"></i>
                <span>Add Item</span>
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full">
        <!-- Notification Banner -->
        <div id="alertBox" class="hidden mb-6 items-center justify-between p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl shadow-sm transition-all">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                <p id="alertMsg" class="text-sm font-medium"></p>
            </div>
            <button onclick="document.getElementById('alertBox').classList.add('hidden')" class="text-emerald-500 hover:text-emerald-700">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="indexView" class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-gray-900">Inventory Items</h1>
                    <p class="text-xs text-gray-500 mt-1">Manage and track your list of items easily</p>
                </div>
                <span id="itemCountBadge" class="inline-flex items-center gap-1.5 px-3 py-1 bg-gray-100 text-gray-700 text-xs font-semibold rounded-full w-fit">
                    <i class="fa-solid fa-layer-group text-gray-500"></i>
                    <span>Total: 0 item(s)</span>
                </span>
            </div>

            <div id="emptyState" class="hidden text-center py-16 px-4">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-regular fa-folder-open"></i>
                </div>
                <h3 class="text-base font-semibold text-gray-900">No items found</h3>
                <p class="text-sm text-gray-500 mt-1 mb-6">Get started by creating your very first inventory item.</p>
                <button onclick="openCreateModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow-sm transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Item Now</span>
                </button>
            </div>

            <div id="tableContainer" class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/75 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="py-3.5 px-6">ID</th>
                            <th class="py-3.5 px-6">Item Name</th>
                            <th class="py-3.5 px-6">Description</th>
                            <th class="py-3.5 px-6">Price</th>
                            <th class="py-3.5 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTableBody" class="divide-y divide-gray-100 text-sm">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="formView" class="hidden max-w-xl mx-auto">
            <button onclick="showView('index')" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-gray-800 mb-4 transition font-medium">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to items list</span>
            </button>

            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">
                <div class="mb-6">
                    <h1 id="formTitle" class="text-xl font-bold text-gray-900">Add New Item</h1>
                    <p id="formSubtitle" class="text-xs text-gray-500 mt-1">Fill out the details below.</p>
                </div>

                <form id="itemForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                    <input type="hidden" id="itemId">
                    <div>
                        <label for="itemName" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Item Name</label>
                        <input type="text" id="itemName" placeholder="e.g. Wireless Mechanical Keyboard"
                               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" required>
                    </div>

                    <div>
                        <label for="itemPrice" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Price ($)</label>
                        <input type="number" step="0.01" id="itemPrice" placeholder="0.00"
                               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" required>
                    </div>

                    <div>
                        <label for="itemDesc" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">Description</label>
                        <textarea id="itemDesc" rows="4" placeholder="Briefly describe this item..."
                                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm transition" required></textarea>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                        <button type="button" onclick="showView('index')" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition">
                            Cancel
                        </button>
                        <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition inline-flex items-center gap-2">
                            <i class="fa-solid fa-check"></i>
                            <span id="submitBtnText">Save Item</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 mt-auto">
        Laravel CRUD Application &bull; Interactive Browser Preview
    </footer>

    <script>
        let items = JSON.parse(localStorage.getItem('crud_items')) || [
            { id: 1, name: "Dell UltraSharp Monitor 27\"", description: "4K UHD IPS display with USB-C hub connectivity", price: 349.99 },
            { id: 2, name: "Logitech MX Master 3S", description: "Ergonomic wireless mouse with quiet clicks and 8K DPI sensor", price: 99.00 },
            { id: 3, name: "Keychron Q1 Pro Keyboard", description: "Custom mechanical keyboard with wireless bluetooth and RGB backlighting", price: 189.50 }
        ];

        let nextId = items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1;

        function saveItems() {
            localStorage.setItem('crud_items', JSON.stringify(items));
            renderTable();
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertBox');
            document.getElementById('alertMsg').textContent = msg;
            alertBox.classList.remove('hidden');
            alertBox.classList.add('flex');
            setTimeout(() => {
                alertBox.classList.add('hidden');
                alertBox.classList.remove('flex');
            }, 4000);
        }

        function showView(view) {
            if (view === 'index') {
                document.getElementById('indexView').classList.remove('hidden');
                document.getElementById('formView').classList.add('hidden');
                renderTable();
            } else {
                document.getElementById('indexView').classList.add('hidden');
                document.getElementById('formView').classList.remove('hidden');
            }
        }

        function openCreateModal() {
            document.getElementById('itemId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDesc').value = '';
            document.getElementById('formTitle').textContent = 'Add New Item';
            document.getElementById('formSubtitle').textContent = 'Fill out the details below to create a new item.';
            document.getElementById('submitBtnText').textContent = 'Save Item';
            showView('form');
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            document.getElementById('itemDesc').value = item.description;
            document.getElementById('formTitle').textContent = 'Edit Item #' + item.id;
            document.getElementById('formSubtitle').textContent = 'Modify details for this item below.';
            document.getElementById('submitBtnText').textContent = 'Update Item';
            showView('form');
        }

        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                items = items.filter(i => i.id !== id);
                saveItems();
                showAlert('Item deleted successfully.');
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const description = document.getElementById('itemDesc').value.trim();

            if (id) {
                const item = items.find(i => i.id === parseInt(id));
                if (item) {
                    item.name = name;
                    item.price = price;
                    item.description = description;
                    showAlert('Item updated successfully.');
                }
            } else {
                items.push({
                    id: nextId++,
                    name,
                    price,
                    description
                });
                showAlert('Item created successfully.');
            }

            saveItems();
            showView('index');
        }

        function renderTable() {
            const tbody = document.getElementById('itemsTableBody');
            const emptyState = document.getElementById('emptyState');
            const tableContainer = document.getElementById('tableContainer');
            const countBadge = document.getElementById('itemCountBadge');

            countBadge.querySelector('span').textContent = `Total: ${items.length} item(s)`;

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                tableContainer.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                tableContainer.classList.remove('hidden');

                tbody.innerHTML = items.map(item => `
                    <tr class="hover:bg-gray-50/60 transition">
                        <td class="py-4 px-6 text-gray-400 font-mono text-xs">#${item.id}</td>
                        <td class="py-4 px-6 font-semibold text-gray-900">${item.name}</td>
                        <td class="py-4 px-6 text-gray-600 max-w-xs truncate">${item.description}</td>
                        <td class="py-4 px-6">
                            <span class="inline-block px-2.5 py-1 bg-emerald-50 text-emerald-700 font-semibold text-xs rounded-md">
                                $${Number(item.price).toFixed(2)}
                            </span>
                        </td>
                        <td class="py-4 px-6 text-right">
                            <div class="flex items-center justify-end gap-2">
                                <button onclick="openEditModal(${item.id})" 
                                        class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 rounded-lg transition"
                                        title="Edit Item">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                    <span>Edit</span>
                                </button>
                                <button onclick="deleteItem(${item.id})" 
                                        class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg transition"
                                        title="Delete Item">
                                    <i class="fa-solid fa-trash-can"></i>
                                    <span>Delete</span>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }
        }
        renderTable();
    </script>
</body>
</html>
